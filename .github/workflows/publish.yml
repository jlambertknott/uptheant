name: Publish site

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

concurrency:
  group: publish-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  merge:
    if: github.ref_name != 'main' && github.ref_name != 'gh-pages'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bring this branch's changes onto main
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git checkout main
          git merge --no-edit -X theirs "origin/${GITHUB_REF_NAME}"
          git push origin main
      - name: Publish main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish.yml --ref main --repo "${{ github.repository }}"

  deploy:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect the site
        run: |
          mkdir -p _site/photos/t
          cp index.html _site/
          touch _site/.nojekyll

          # Photos for the Across the Years tab. Anything dropped into photos/
          # gets resized here: a big one for tapping on and a thumbnail for the
          # grid. photos.json tells the page what's there.
          #
          # Pillow is installed here, in the shell, rather than from inside the
          # script below: a freshly installed package isn't importable by a
          # Python process that was already running when it was installed.
          shopt -s nullglob nocaseglob
          found=(photos/*.jpg photos/*.jpeg photos/*.png photos/*.webp)
          echo "${#found[@]} photo file(s) in photos/"
          if [ ${#found[@]} -gt 0 ] && ! python3 -c 'import PIL' 2>/dev/null; then
            python3 -m pip install --quiet --disable-pip-version-check Pillow \
              || python3 -m pip install --quiet --disable-pip-version-check --break-system-packages Pillow \
              || echo "could not install Pillow; falling back to copying the originals"
          fi

          python3 - <<'PY'
          import datetime, glob, json, os, re, shutil

          try:
              from PIL import Image, ImageOps
          except ImportError:
              Image = None

          def display_name(stem):
              m = re.search(r"(20\d{2})-(\d{2})-(\d{2})", stem)      # PHOTO-2024-09-21-10-13-55
              if m:
                  try:
                      d = datetime.date(int(m[1]), int(m[2]), int(m[3]))
                      return f"{d.day} {d:%B %Y}"
                  except ValueError:
                      pass
              return re.sub(r"[-_]+", " ", re.sub(r"^[0-9]+[-_ ]*", "", stem)).strip() or stem

          src = [f for f in sorted(glob.glob("photos/*"))
                 if os.path.splitext(f)[1].lower() in (".jpg", ".jpeg", ".png", ".webp")]
          out, used = [], set()
          for f in src:
              stem = os.path.splitext(os.path.basename(f))[0]
              slug, n = stem, 2
              while slug.lower() in used:                            # two photos sharing a name
                  slug, n = f"{stem}-{n}", n + 1
              used.add(slug.lower())
              if Image:
                  try:
                      im = ImageOps.exif_transpose(Image.open(f)).convert("RGB")
                  except Exception as e:
                      print("skipped", f, e)
                      continue
                  big = im.copy(); big.thumbnail((1600, 1600), Image.LANCZOS)
                  big.save(f"_site/photos/{slug}.jpg", quality=82, optimize=True, progressive=True)
                  th = im.copy(); th.thumbnail((700, 700), Image.LANCZOS)
                  th.save(f"_site/photos/t/{slug}.jpg", quality=78, optimize=True)
                  out.append({"file": slug + ".jpg", "name": display_name(stem)})
              else:
                  ext = os.path.splitext(f)[1].lower()               # last resort: publish as-is
                  shutil.copyfile(f, f"_site/photos/{slug}{ext}")
                  shutil.copyfile(f, f"_site/photos/t/{slug}{ext}")
                  out.append({"file": slug + ext, "name": display_name(stem)})

          json.dump(out, open("_site/photos.json", "w"))
          print(len(out), "photos published", "(originals, not resized)" if not Image else "")
          PY

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
