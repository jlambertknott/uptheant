name: Publish site

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

concurrency:
  group: publish-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  merge:
    if: github.ref_name != 'main' && github.ref_name != 'gh-pages'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bring this branch's changes onto main
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git checkout main
          git merge --no-edit -X theirs "origin/${GITHUB_REF_NAME}"
          git push origin main
      - name: Publish main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish.yml --ref main --repo "${{ github.repository }}"

  deploy:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect the site
        run: |
          mkdir -p _site
          cp index.html _site/
          touch _site/.nojekyll

          # Photos for the Across the Years tab. Drop any jpg/png/webp into
          # photos/ and they get resized here: a big one for tapping on, and a
          # thumbnail for the grid. photos.json tells the page what's there.
          mkdir -p _site/photos/t
          if [ -d photos ]; then
            command -v convert >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick; }
            shopt -s nullglob nocaseglob
            for f in photos/*.jpg photos/*.jpeg photos/*.png photos/*.webp; do
              out="$(basename "${f%.*}").jpg"
              convert "$f" -auto-orient -resize '1600x1600>' -quality 82 "_site/photos/$out" \
                || { echo "skipped $f"; continue; }
              convert "$f" -auto-orient -resize '700x700>' -quality 78 "_site/photos/t/$out" \
                || cp "_site/photos/$out" "_site/photos/t/$out"
            done
          fi
          python3 - <<'PY'
          import json, os, re
          d = "_site/photos"
          files = sorted(f for f in os.listdir(d) if f.lower().endswith(".jpg"))
          def name(f):
              stem = os.path.splitext(f)[0]
              stem = re.sub(r"^[0-9]+[-_ ]*", "", stem)          # drop any ordering prefix
              return re.sub(r"[-_]+", " ", stem).strip() or stem
          json.dump([{"file": f, "name": name(f)} for f in files], open("_site/photos.json", "w"))
          print(len(files), "photos published")
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
